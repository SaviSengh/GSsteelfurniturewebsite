
content:
  - name: products
    label: Products
    type: file
    path: data/products.json
    format: json
    list: true

    fields:
      - name: name
        label: Product Name
        type: string
        required: true

      - name: category
        label: Furniture Category
        type: select
        required: true
        options:
          values:
            - name: steel
              label: Steel Furniture
            - name: parlour
              label: Parlour Furniture
            - name: school
              label: School Furniture
            - name: office
              label: Office Furniture

      - name: code
        label: Product Code
        type: string

      - name: dimensions
        label: Dimensions
        type: string

      - name: type
        label: Product Type
        type: string

      - name: image
        label: Product Photograph
        type: image
        options:
          media: product_images
          extensions:
            - jpg
            - jpeg
            - png
            - webp

      - name: description
        label: Product Description
        type: text

      - name: featured
        label: Featured Product
        type: boolean
